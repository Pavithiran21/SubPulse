<!DOCTYPE html>
<!-- Renewal reminder, design screen 12. Table layout and inline styles, because email clients
     ignore most CSS. th:text escapes every value. -->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Netflix Premium renews in 3 days</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@600;700&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background-color:#f5f6fa;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5f6fa;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
             style="max-width:560px;background-color:#ffffff;border:1px solid #e3e8f2;border-radius:16px;overflow:hidden;">
        <tr>
          <td style="background-color:#1d39c4;background-image:linear-gradient(120deg,#0b1736 0%,#1d39c4 50%,#5b3df0 100%);padding:22px 24px;color:#ffffff;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="vertical-align:middle;"><img src="cid:logo@subpulse" width="28" height="28" alt="" style="display:block;border:0;"></td>
                <td style="vertical-align:middle;padding-left:8px;font:700 16px Lexend,Arial,sans-serif;color:#ffffff;">SubPulse</td>
              </tr>
            </table>
            <div style="font:600 22px/1.25 Lexend,Arial,sans-serif;margin-top:14px;color:#ffffff;" th:text="${title}">Netflix Premium renews in 3 days</div>
          </td>
        </tr>
        <tr>
          <td style="padding:22px 24px;font:400 14px/1.55 Inter,Arial,sans-serif;color:#1f2a44;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="font-size:14px;margin-bottom:16px;">
              <tr>
                <td style="padding:6px 0;color:#5b6785;">Amount</td>
                <td style="padding:6px 0;text-align:right;font:600 14px Lexend,Arial,sans-serif;color:#0b1736;" th:text="${amount}">₹649.00</td>
              </tr>
              <tr>
                <td style="padding:6px 0;color:#5b6785;">Renews on</td>
                <td style="padding:6px 0;text-align:right;"><b style="color:#0b1736;" th:text="${renewsOn}">Mon 20 Oct 2026</b></td>
              </tr>
              <tr>
                <td style="padding:6px 0;color:#5b6785;">Billing</td>
                <td style="padding:6px 0;text-align:right;" th:text="${billing}">Monthly · HDFC card</td>
              </tr>
            </table>
            <p style="margin:0 0 16px;font-size:14px;" th:text="${advice}">Still using it? Nothing to do.</p>
            <a th:href="${viewLink}" href="#"
               style="display:inline-block;background-color:#2f54eb;color:#ffffff;text-decoration:none;border-radius:12px;padding:11px 18px;font:600 15px Inter,Arial,sans-serif;">View subscription</a>
            <p style="font-size:12px;color:#5b6785;margin:16px 0 0;border-top:1px solid #e3e8f2;padding-top:12px;">
              <span th:text="${chosen}">You chose reminders 7, 3 and 1 days before.</span>
              <a th:href="${settingsLink}" href="#" style="color:#2f54eb;font-weight:600;">Change reminder settings</a>
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
