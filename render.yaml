# Render Blueprint: one free web service for the API only (Dockerfile.api). The React app is hosted on
# Vercel (Root Directory: frontend); its vercel.json forwards /api/* to this service, so the browser sees
# one origin and the refresh cookie keeps working. Set FRONTEND_URL below to the Vercel URL.
# The database is TiDB Cloud Starter (free, MySQL-compatible) with a subpulse_demo database. It accepts only
# TLS, so set SPRING_DATASOURCE_URL to
#   jdbc:mysql://<host>:4000/subpulse_demo?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=VERIFY_IDENTITY
# (Java already trusts its certificate authority). Flyway creates the tables on the first start.
# Free Render services have no Shell, so seed the demo data once from your own machine, with the same
# database settings (and ENV_FILE pointing at an env file that ends in /subpulse_demo):
#   java -jar backend/target/subpulse-backend.jar --spring.profiles.active=seed-demo --spring.main.web-application-type=none
# Free Render also blocks outbound SMTP (ports 25, 465, 587), so no reminder or password-reset email is sent.
# Free services sleep after 15 minutes without traffic, and the in-process reminder job only runs while
# awake, so point an external cron (e.g. cron-job.org, every 15 minutes) at POST /api/internal/jobs/reminders
# with the X-Job-Secret header.
services:
  - type: web
    name: subpulse-pavithiran
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: native # trust the proxies, so rate limits see the visitor's IP
      - key: SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES
        value: '.*' # Vercel's egress IPs are public: trust every hop and take the visitor's IP from X-Forwarded-For
      - key: LOG_LEVEL
        value: INFO
      - key: DEMO_MODE
        value: 'true'
      - key: RATE_LIMITS_ENABLED
        value: 'true'
      - key: DB_NAME
        value: subpulse_demo
      - key: JWT_SECRET
        generateValue: true
      - key: JOB_TRIGGER_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # the Vercel URL, https://<project>.vercel.app (CORS and the links in emails)
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: DEMO_SMTP_HOST
        sync: false
      - key: DEMO_SMTP_PORT
        sync: false
      - key: DEMO_SMTP_USER
        sync: false
      - key: DEMO_SMTP_PASS
        sync: false
